version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: troca_time_qa
    
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    
    ports:
      - "${DB_PORT}:3306"
    
    volumes:
      - ./.containers/mysql/data:/var/lib/mysql
      - ./.containers/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
